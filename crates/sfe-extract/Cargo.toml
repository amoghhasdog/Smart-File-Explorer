[package]
name = "sfe-extract"
description = "Extractor trait, registry and adapters (plain text, pdf, office, image, media)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sfe-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
encoding_rs = "0.8"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
kamadak-exif = "0.6"
mp4 = "0.14"
matroska = "0.30"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "ogg", "vorbis", "pcm", "aac", "isomp4"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
